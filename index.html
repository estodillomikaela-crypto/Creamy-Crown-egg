<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creamy Crown Egg | Royal Street Gourmet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #faf6f0;
      --card-cream: #f4ebe1;
      --primary-terra: #c45b34;
      --primary-terra-hover: #ab4823;
      --accent-gold: #c98816;
      --text-dark: #241e19;
      --text-muted: #6e645a;
      --white: #ffffff;
      --light-gold: #f7ead2;
      --radius-xl: 32px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-full: 9999px;
      --shadow-soft: 0 10px 30px rgba(70, 45, 25, 0.06);
      --shadow-hover: 0 16px 36px rgba(196, 91, 52, 0.16);
      --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      padding: 1.2rem 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-cream);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(196, 91, 52, 0.08);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-gold);
    }

    .brand-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--text-dark);
      font-weight: 800;
      line-height: 1;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .nav-menu a:hover {
      color: var(--primary-terra);
    }

    /* =========================
       HERO
    ========================== */

    .hero-wrapper {
      padding: 0.5rem 6% 3.5rem;
    }

    .hero-card {
      background-color: var(--card-cream);
      border-radius: var(--radius-xl);
      padding: 4rem 5rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 3.5rem;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.6rem;
      font-weight: 700;
      line-height: 1.15;
      color: var(--text-dark);
      margin-bottom: 1.4rem;
    }

    .hero-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 2.2rem;
      max-width: 480px;
    }

    .hero-btns {
      display: flex;
      gap: 1.2rem;
    }

    .btn-terra {
      display: inline-block;
      background-color: var(--primary-terra);
      color: var(--white);
      padding: 0.9rem 2.2rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .btn-terra:hover {
      background-color: var(--primary-terra-hover);
      transform: translateY(-2px);
    }

    .btn-outline-dark {
      border: 1.5px solid #d4c4b2;
      background: transparent;
      color: var(--text-dark);
      padding: 0.85rem 2rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-outline-dark:hover {
      border-color: var(--text-dark);
      background: rgba(0, 0, 0, 0.03);
    }

    .hero-img-wrap {
      display: flex;
      justify-content: center;
    }

    .hero-dish-img {
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(60, 35, 15, 0.15);
      border: 8px solid var(--white);
      object-fit: cover;
    }

    /* =========================
       SECTION HEADINGS
    ========================== */

    .section-head {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 3rem;
    }

    .badge-pill {
      display: inline-block;
      background: #ebd8c8;
      color: var(--primary-terra);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0.35rem 1.1rem;
      border-radius: var(--radius-full);
      margin-bottom: 0.8rem;
    }

    .section-head h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .section-head p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* =========================
       MENU
    ========================== */

    .dishes-section {
      padding: 5rem 6%;
      max-width: 1350px;
      margin: 0 auto;
    }

    .menu-board-container {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-soft);
      text-align: center;
      border: 1px solid #eee2d3;
      margin-bottom: 3rem;
    }

    .menu-board-img {
      max-width: 900px;
      width: 100%;
      border-radius: var(--radius-lg);
      margin-top: 1rem;
    }

    /* Menu Description Cards */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.2rem;
      margin-top: 2rem;
    }

    .menu-card {
      background: var(--white);
      border: 1px solid #ebd9c7;
      border-radius: var(--radius-lg);
      padding: 1.7rem 1.3rem;
      text-align: center;
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: "♛";
      position: absolute;
      top: -12px;
      right: -8px;
      font-size: 4rem;
      color: rgba(201, 136, 22, 0.08);
      transform: rotate(15deg);
    }

    .menu-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-terra);
    }

    .menu-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--light-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
    }

    .menu-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--text-dark);
      margin-bottom: 0.7rem;
    }

    .menu-card p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.65;
      margin-bottom: 1rem;
    }

    .menu-price {
      display: inline-block;
      background: var(--primary-terra);
      color: white;
      border-radius: var(--radius-full);
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 800;
    }

    /* =========================
       ABOUT
    ========================== */

    .about-section {
      background: var(--card-cream);
      padding: 5rem 6%;
      border-radius: var(--radius-xl);
      margin: 2rem 6% 4rem;
      text-align: center;
    }

    .about-tagline {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--text-dark);
      margin-bottom: 1.2rem;
      font-style: italic;
    }
